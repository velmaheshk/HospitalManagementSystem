<div class="container-fluid p-4">

  <div class="mb-4">

    <h2>

      @if (isEditMode) {
        Edit Doctor
      }
      @else {
        Add Doctor
      }

    </h2>

  </div>


  <div class="card shadow-sm">

    <div class="card-body">


      <form
        [formGroup]="doctorForm"
        (ngSubmit)="save()">


        <div class="row g-3">


          <!-- First Name -->

          <div class="col-md-6">

            <label class="form-label">

              First Name

            </label>

            <input
              type="text"
              class="form-control"
              formControlName="firstName">

            @if (
              f.firstName.touched &&
              f.firstName.invalid
            ) {

              <div class="text-danger">

                First name is required

              </div>

            }

          </div>


          <!-- Last Name -->

          <div class="col-md-6">

            <label class="form-label">

              Last Name

            </label>

            <input
              type="text"
              class="form-control"
              formControlName="lastName">

          </div>


          <!-- Email -->

          <div class="col-md-6">

            <label class="form-label">

              Email

            </label>

            <input
              type="email"
              class="form-control"
              formControlName="email">

            @if (
              f.email.touched &&
              f.email.invalid
            ) {

              <div class="text-danger">

                Enter a valid email

              </div>

            }

          </div>


          <!-- Phone -->

          <div class="col-md-6">

            <label class="form-label">

              Phone Number

            </label>

            <input
              type="text"
              class="form-control"
              formControlName="phoneNumber">

          </div>


          <!-- Specialization -->

          <div class="col-md-6">

            <label class="form-label">

              Specialization

            </label>

            <select
              class="form-select"
              formControlName="specialization">

              <option value="">
                Select specialization
              </option>

              <option value="Cardiology">
                Cardiology
              </option>

              <option value="Neurology">
                Neurology
              </option>

              <option value="Orthopedics">
                Orthopedics
              </option>

              <option value="Pediatrics">
                Pediatrics
              </option>

              <option value="Dermatology">
                Dermatology
              </option>

              <option value="General Medicine">
                General Medicine
              </option>

            </select>

          </div>


          <!-- Qualification -->

          <div class="col-md-6">

            <label class="form-label">

              Qualification

            </label>

            <input
              type="text"
              class="form-control"
              placeholder="MBBS, MD"
              formControlName="qualification">

          </div>


          <!-- Experience -->

          <div class="col-md-4">

            <label class="form-label">

              Experience (Years)

            </label>

            <input
              type="number"
              class="form-control"
              formControlName="experienceYears">

          </div>


          <!-- Consultation Fee -->

          <div class="col-md-4">

            <label class="form-label">

              Consultation Fee

            </label>

            <input
              type="number"
              class="form-control"
              formControlName="consultationFee">

          </div>


          <!-- Department -->

          <div class="col-md-4">

            <label class="form-label">

              Department ID

            </label>

            <input
              type="number"
              class="form-control"
              formControlName="departmentId">

          </div>


          <!-- Status -->

          <div class="col-md-12">

            <div class="form-check">

              <input
                class="form-check-input"
                type="checkbox"
                formControlName="isActive"
                id="isActive">

              <label
                class="form-check-label"
                for="isActive">

                Active Doctor

              </label>

            </div>

          </div>


          <!-- Buttons -->

          <div class="col-12 mt-4">

            <button
              type="submit"
              class="btn btn-primary me-2"
              [disabled]="loading">

              @if (loading) {
                Saving...
              }
              @else if (isEditMode) {
                Update Doctor
              }
              @else {
                Save Doctor
              }

            </button>


            <button
              type="button"
              class="btn btn-secondary"
              (click)="cancel()">

              Cancel

            </button>

          </div>


        </div>

      </form>

    </div>

  </div>

</div>
